# Build and publish the site to GitHub Pages on every push to main.
#
# The .env file is git-ignored, so a build run here has no configuration of its
# own. The values come from the repository's secrets and variables instead —
# see README.md, "Deploying". Without them the site still builds and loads, it
# simply shows "Connect the Google Sheet" and no data.
#
# The built site is pushed to the gh-pages branch, because Pages for this repo
# is set to "Deploy from a branch". That needs no repository settings change.
# Switching Pages to the "GitHub Actions" source instead would require the
# official deploy-pages action, and a workflow on main is refused by the
# github-pages environment until that switch is made.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab after changing a secret, without
  # having to make an empty commit.
  workflow_dispatch:

# Pushing the built site to gh-pages is a write to the repository.
permissions:
  contents: write

# Never let two publishes race. A run already in progress is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          GITHUB_PAGES: "true"
          # Reading the sheet needs only the id, and the sheet is already shared
          # publicly as "anyone with the link — Viewer", so it is not a secret.
          # The fallback is the live Chintan_Waste_Data sheet, so the deployed
          # site reads real data without any repository configuration. Set a
          # VITE_SHEET_ID repository variable to point a build at another sheet.
          VITE_SHEET_ID: ${{ vars.VITE_SHEET_ID || '1vSTj0KwymQxn-UCUbzMxRL69y3CtCx7cq529siCS-zY' }}
          VITE_DRIVE_FOLDER_ID: ${{ vars.VITE_DRIVE_FOLDER_ID }}
          VITE_CACHE_MINUTES: ${{ vars.VITE_CACHE_MINUTES || '5' }}
          VITE_LOGO_URL: ${{ vars.VITE_LOGO_URL }}
          # Writing goes through the Apps Script Web App.
          VITE_SHEET_API_URL: ${{ secrets.VITE_SHEET_API_URL }}
          VITE_SHEET_API_KEY: ${{ secrets.VITE_SHEET_API_KEY }}
        run: npm run build:pages

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Stops Pages running the output through Jekyll.
          touch dist/.nojekyll
          cd dist
          git init -q
          git checkout -qb gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Deploy ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
